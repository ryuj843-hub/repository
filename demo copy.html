.circle {

    border-radius: 100%;
    background-color: rgb(136, 136, 158);

    transition-duration: 350ms;
    transition-timing-function: ease-in-out;

    filter: blur(10px)
}


.circle:hover {

    background-color: rgb(200, 194, 128);
    filter: blur(25px);
   
}
